<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Geliştirme — 3D BMO önizleme</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=VT323&display=swap">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #3a2414 url(/bg/day-1920.webp) center/cover no-repeat; font: 13px system-ui; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
    .bar { position: fixed; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 16px); }
    .bar button, .bar select { font: inherit; padding: 4px 8px; border: 2px solid #2b1a12; border-radius: 6px; background: #f6ead0; cursor: pointer; }
    .lbl { position: fixed; bottom: 8px; width: 33.3%; text-align: center; color: #f6ead0; text-shadow: 0 1px 0 #2b1a12; font-weight: 700; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="bar" id="bar"></div>
  <div class="lbl" style="left:0">önden</div><div class="lbl" style="left:33.3%">¾</div><div class="lbl" style="left:66.6%">yandan</div>
  <script type="module" src="./bmo.js"></script>
</body>
</html>

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Erdem'in Kaset Odası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Nunito:wght@500;700;800&family=VT323&display=swap">
<style>
/* Layout: 1024×572 tasarım ölçeğinde çizilmiş oda sahnesi ekranı "cover" ile doldurur; UI katmanı (tabela, terminal, TV) sahnenin üstünde gerçek piksellerle durur */
:root{
  color-scheme: dark;
  --ink:#2a1810;          /* çizimdeki kontur rengi */
  --wood:#a86a3c; --wood-dk:#7a4625; --wood-lt:#c98c55;
  --paper:#f6ead0;
  --phos:#9df2b4; --phos-dim:#5c9c6e; --crt:#0d1912;
  --glow:#ffd98a;
  --f-hand:"Gochi Hand","Comic Sans MS",cursive;
  --f-term:"VT323",ui-monospace,Menlo,monospace;
  --f-body:"Nunito",system-ui,sans-serif;
}
html,body{height:100%}
body{background:#3a2112;color:var(--paper);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}

/* ---------- sahne ---------- */
.room{position:fixed;inset:0;overflow:hidden}
.stage{position:absolute;left:50%;top:50%;width:1024px;height:572px;transform-origin:center;will-change:transform}
.bg{position:absolute;inset:0;background:url("bg.webp") center/100% 100% no-repeat}
.beam{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;filter:blur(7px);
  clip-path:polygon(92px 150px,178px 128px,640px 572px,250px 572px);
  background:linear-gradient(128deg,rgba(255,232,160,.42),rgba(255,220,140,.12) 60%,transparent 85%);animation:beam 7s ease-in-out infinite}
@keyframes beam{50%{opacity:.65}}
#dust{position:absolute;inset:0;width:1024px;height:572px;pointer-events:none}
.lantern{position:absolute;width:var(--d);height:var(--d);margin:calc(var(--d)/-2) 0 0 calc(var(--d)/-2);border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,200,110,.55),rgba(255,170,80,.18) 45%,transparent 70%);animation:flicker 2.6s infinite}
@keyframes flicker{0%,100%{opacity:.9}20%{opacity:.7}23%{opacity:1}55%{opacity:.8}70%{opacity:.95}}
.vignette{position:absolute;inset:-2px;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 55%,transparent 55%,rgba(28,10,3,.55))}

/* ---------- robot ---------- */
.robot{position:absolute;left:412px;top:296px;width:196px;aspect-ratio:516/468;cursor:pointer;z-index:3}
.robot .shadow{position:absolute;left:4%;right:4%;bottom:-2%;height:12%;border-radius:50%;background:radial-gradient(closest-side,rgba(40,16,4,.55),transparent)}
.robot .body{position:absolute;inset:0;transform-origin:50% 92%;animation:breathe 3.4s ease-in-out infinite}
.robot img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
@keyframes breathe{50%{transform:scale(1.012,.985)}}
.robot.hungry .body{animation:hungry .32s ease-in-out infinite}
@keyframes hungry{25%{transform:rotate(-2.5deg) translateY(-4px)}75%{transform:rotate(2.5deg) translateY(-4px)}}
.robot.gulp .body{animation:gulp .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes gulp{30%{transform:scale(1.08,.88)}60%{transform:scale(.96,1.06)}}
.robot.loaded .body{animation:groove .9s ease-in-out infinite}
@keyframes groove{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg) translateY(-3px)}}
.lid{position:absolute;width:24%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none}
.lid svg{width:100%;height:100%;display:block}
.robot.blink .lid{opacity:1}
.slot{position:absolute;left:43%;top:62.2%;width:23.5%;height:9%;border-radius:3px;pointer-events:none}
.slot .mini{position:absolute;inset:0;border-radius:3px;background:var(--lab,#e2b04a);border:2px solid var(--ink);opacity:0;transform:translateY(-120%);transition:opacity .15s,transform .35s cubic-bezier(.3,1.5,.5,1);
  display:flex;align-items:center;justify-content:space-around;padding:0 18%}
.slot .mini i{width:24%;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--paper) 0 20%,var(--ink) 0 25%,var(--paper) 0 45%,var(--ink) 0 50%,var(--paper) 0 70%,var(--ink) 0 75%,var(--paper) 0 95%,var(--ink) 0);border:1.5px solid var(--ink)}
.robot.loaded .slot .mini{opacity:1;transform:none}
.robot.loaded .slot .mini i{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.robot.hungry .slot{box-shadow:0 0 0 2px var(--glow),0 0 18px 4px rgba(255,217,138,.8)}
.note{position:absolute;font-family:var(--f-hand);font-size:22px;color:var(--paper);-webkit-text-stroke:1.2px var(--ink);pointer-events:none;animation:note 2.2s ease-out forwards;z-index:4}
@keyframes note{0%{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-70px) rotate(var(--rot))}}
.hint{position:absolute;left:600px;top:250px;z-index:4;pointer-events:none;font-family:var(--f-hand);font-size:19px;line-height:1;color:var(--paper);-webkit-text-stroke:.6px var(--ink);
  text-shadow:0 2px 0 var(--ink);transform:rotate(-6deg);transition:opacity .4s}
.hint svg{display:block;margin:2px 0 0 -16px}
.hint.off{opacity:0}

/* ---------- kasetler ---------- */
.tape{position:absolute;font-size:10px;padding:0;border:0;background:none;color:inherit;cursor:grab;touch-action:none;
  transform:translate(-50%,-100%) scale(var(--sc,1)) rotate(var(--r,0deg));transform-origin:50% 100%;transition:transform .2s,filter .2s;z-index:2}
.tape:hover{transform:translate(-50%,-100%) scale(calc(var(--sc,1)*1.08)) rotate(0deg) translateY(-3px);filter:drop-shadow(0 0 6px rgba(255,217,138,.9))}
.tape:focus-visible{outline:2px dashed var(--glow);outline-offset:4px;border-radius:6px}
.tape.gone{visibility:hidden}
.tape.pop{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{filter:brightness(1.6)}40%{filter:brightness(1.2) drop-shadow(0 0 10px rgba(255,217,138,1))}}
.cas{position:relative;display:block;width:7em;height:4.5em;border:.22em solid var(--ink);border-radius:.5em;background:var(--shell,#4a3a36);
  box-shadow:inset .25em .25em 0 rgba(255,255,255,.14),inset -.25em -.3em 0 rgba(0,0,0,.25),0 .2em 0 rgba(30,10,2,.35)}
.lab{position:absolute;left:.4em;right:.4em;top:.38em;height:2.35em;border:.14em solid var(--ink);border-radius:.25em;overflow:hidden;
  background:repeating-linear-gradient(180deg,transparent 0 .52em,rgba(120,90,60,.22) .52em .6em),var(--paper)}
.lab::before{content:"";position:absolute;left:0;right:0;top:0;height:.55em;background:var(--lab);border-bottom:.12em solid var(--ink)}
.lab b{position:absolute;left:.3em;right:.3em;top:.62em;font-family:var(--f-hand);font-weight:400;font-size:1.12em;line-height:1.1;color:#3a2418;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab em{position:absolute;right:.25em;top:-.05em;font-style:normal;font-family:var(--f-hand);font-size:.62em;color:var(--ink);opacity:.8}
.win{position:absolute;left:1.6em;right:1.6em;bottom:.42em;height:1.2em;border-radius:.6em;background:#2a1810;display:flex;align-items:center;justify-content:space-between;padding:0 .18em}
.win::before{content:"";position:absolute;left:1em;right:1em;top:.35em;bottom:.35em;background:#6b3f22;border-radius:.2em}
.win i{position:relative;width:.85em;height:.85em;border-radius:50%;background:conic-gradient(#e9dcc0 0 20%,#2a1810 0 25%,#e9dcc0 0 45%,#2a1810 0 50%,#e9dcc0 0 70%,#2a1810 0 75%,#e9dcc0 0 95%,#2a1810 0)}
.tape:hover .win i{animation:spin 1.4s linear infinite}
.scr{position:absolute;bottom:.3em;width:.38em;height:.38em;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.5) 0 30%,rgba(255,255,255,.25) 31%)}
.scr.a{left:.4em}.scr.b{right:.4em}
.easel{position:relative;display:block;width:5.4em;height:1.3em;margin:-.25em auto 0}
.easel::before{content:"";position:absolute;left:0;right:0;top:0;height:.5em;background:linear-gradient(var(--wood-lt),var(--wood));border:.15em solid var(--ink);border-radius:.2em;z-index:1}
.easel::after{content:"";position:absolute;left:.5em;right:.5em;top:.3em;bottom:0;
  background:linear-gradient(100deg,transparent 40%,var(--ink) 40% 46%,var(--wood-dk) 46% 54%,var(--ink) 54% 60%,transparent 60%) left/26% 100% no-repeat,
             linear-gradient(80deg,transparent 40%,var(--ink) 40% 46%,var(--wood-dk) 46% 54%,var(--ink) 54% 60%,transparent 60%) right/26% 100% no-repeat}
.contact{position:absolute;left:-10%;right:-10%;bottom:-.35em;height:.8em;border-radius:50%;background:radial-gradient(closest-side,rgba(30,10,2,.5),transparent);z-index:-1}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;transform-origin:0 0;filter:drop-shadow(0 12px 8px rgba(20,6,0,.45))}
.ghost .easel{display:none}

/* ---------- UI ---------- */
.sign{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));z-index:10;transform-origin:50% 0;animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.6deg)}}
.sign .rope{display:block;width:120px;height:20px;margin:0 auto -4px;background:
  linear-gradient(60deg,transparent 47%,#d7b98a 47% 53%,transparent 53%) left/50% 100% no-repeat,
  linear-gradient(-60deg,transparent 47%,#d7b98a 47% 53%,transparent 53%) right/50% 100% no-repeat}
.plank{position:relative;background:linear-gradient(180deg,var(--wood-lt),var(--wood) 60%,var(--wood-dk));border:3px solid var(--ink);border-radius:10px;padding:8px 18px 9px;box-shadow:0 5px 0 rgba(30,10,2,.5)}
.plank::before,.plank::after{content:"";position:absolute;top:8px;width:7px;height:7px;border-radius:50%;background:#4a2a16}
.plank::before{left:7px}.plank::after{right:7px}
.plank h1{margin:0;font-family:var(--f-hand);font-weight:400;font-size:30px;line-height:1;color:var(--paper);text-shadow:0 2px 0 var(--ink)}
.plank p{margin:3px 0 0;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#3a2010}
.sound{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));z-index:10;
  font-family:var(--f-term);font-size:18px;color:var(--phos);background:rgba(13,25,18,.82);border:2px solid #3f7a52;border-radius:8px;padding:3px 10px;cursor:pointer}
.sound:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

.term{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10;width:min(600px,calc(100% - 32px));
  background:rgba(10,20,14,.9);border:2px solid #4fae6d;border-radius:8px;box-shadow:0 0 0 3px rgba(42,24,16,.85),0 0 22px rgba(79,174,109,.25);
  font-family:var(--f-term);color:var(--phos);overflow:hidden}
.term .bar{display:flex;justify-content:space-between;padding:2px 10px;background:#4fae6d;color:#0a140e;font-size:16px}
.term p{margin:0;padding:8px 12px 2px;font-size:21px;line-height:1.15;min-height:2.4em;text-shadow:0 0 6px rgba(157,242,180,.45)}
.term p::after{content:"▌";animation:caret 1s steps(1) infinite;margin-left:2px}
@keyframes caret{50%{opacity:0}}
.term small{display:block;padding:0 12px 8px;font-size:15px;color:var(--phos-dim)}

.tray{display:none}

/* ---------- TV görüntüleyici ---------- */
.viewer{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:flex-end;
  padding:24px max(4vw,env(safe-area-inset-right,0px)) 150px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(90deg,transparent 35%,rgba(24,9,2,.6))}
.tv{position:relative;width:min(470px,100%);max-height:100%;display:flex;gap:14px;padding:16px;border:4px solid var(--ink);border-radius:24px;
  background:repeating-linear-gradient(95deg,rgba(0,0,0,.06) 0 3px,transparent 3px 11px),linear-gradient(180deg,#b9804c,#8e5530);
  box-shadow:inset 0 3px 0 rgba(255,220,170,.35),inset 0 -5px 0 rgba(0,0,0,.25),0 18px 40px rgba(20,6,0,.6);animation:tvIn .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes tvIn{from{transform:translateY(30px) rotate(3deg);opacity:0}}
.screen{position:relative;flex:1;min-width:0;overflow:auto;max-height:calc(100vh - 220px);padding:16px 18px;border:4px solid var(--ink);border-radius:18px/24px;background:radial-gradient(ellipse at center,#14281b,var(--crt) 75%);
  box-shadow:inset 0 0 30px rgba(0,0,0,.8);font-family:var(--f-term);color:var(--phos);animation:crt .55s ease-out}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px);border-radius:inherit}
@keyframes crt{0%{clip-path:inset(49% 0 49% 0);filter:brightness(3)}50%{clip-path:inset(0);filter:brightness(1.6)}100%{filter:none}}
.knobs{display:flex;flex-direction:column;align-items:center;gap:12px;width:52px;padding-top:6px}
.knob{width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 35% 30%,#e9dcc0,#a8916a);position:relative}
.knob::after{content:"";position:absolute;left:50%;top:3px;width:3px;height:11px;margin-left:-1.5px;background:var(--ink);border-radius:2px;transform-origin:50% 12px}
.knob.k2::after{transform:rotate(70deg)}
.grill{width:40px;height:70px;border:3px solid var(--ink);border-radius:8px;background:repeating-linear-gradient(180deg,#5a341c 0 4px,#2a1810 4px 7px)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:17px;color:var(--phos-dim)}
.chip{border:1px solid currentColor;border-radius:4px;padding:0 6px;font-size:16px}
.chip.live{color:#ffd36b}
.screen h2{margin:6px 0 0;font-weight:400;font-size:clamp(34px,5vw,44px);line-height:.95;color:#dcffe6;text-shadow:0 0 10px rgba(157,242,180,.5);text-wrap:balance}
.kind{font-size:19px;color:var(--phos-dim)}
.desc{font-family:var(--f-body);font-size:14.5px;line-height:1.55;color:#cfe9d6;margin:10px 0 12px;-webkit-user-select:text;user-select:text}
.stack{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.stack li{background:#1b3324;border:1px solid #2f5a3d;border-radius:4px;padding:0 8px;font-size:18px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions a,.eject{font-family:var(--f-term);font-size:20px;line-height:1.2;border-radius:6px;padding:3px 12px;text-decoration:none;cursor:pointer;border:0}
.actions a{color:#0a140e;background:var(--phos)}
.eject{margin-left:auto;color:var(--paper);background:#d9774a;box-shadow:0 3px 0 #9a4a26}
.actions a:focus-visible,.eject:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* ---------- dar ekran ---------- */
@media (max-width:820px){
  .viewer{justify-content:center;align-items:flex-end;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(150px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(24,9,2,.55)}
  .knobs{display:none}
  .tv{padding:10px}
  .screen{max-height:calc(100vh - 280px)}
}
@media (max-width:700px){
  .tray{display:flex;position:fixed;left:0;right:0;top:calc(92px + env(safe-area-inset-top,0px));z-index:9;gap:12px;overflow-x:auto;scrollbar-width:none;
    padding:8px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(42,24,16,.7),rgba(42,24,16,0))}
  .tray::-webkit-scrollbar{display:none}
  .tray .tape{position:relative;left:auto!important;top:auto!important;flex:0 0 auto;font-size:13px;transform:none;touch-action:pan-x}
  .tray .tape:hover{transform:translateY(-2px)}
  .tray .easel{display:none}
  .hint{display:none}
  .sign .rope{display:none}
  .plank{padding:6px 14px 7px}
  .plank h1{font-size:25px}
  .plank p{font-size:10px}
  .term p{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="room" id="room">
  <div class="stage" id="stage">
    <div class="bg" role="img" aria-label="Ağaç evin içinde sıcak ışıklı ahşap bir oda"></div>
    <div class="beam"></div>
    <div class="lantern" style="left:713px;top:236px;--d:90px"></div>
    <div class="lantern" style="left:996px;top:258px;--d:80px;animation-delay:-1.1s"></div>
    <div class="lantern" style="left:101px;top:468px;--d:110px;animation-delay:-.6s"></div>
    <canvas id="dust" width="2048" height="1144"></canvas>

    <div class="robot" id="robot" aria-label="Kaset robotu Teypo">
      <div class="shadow"></div>
      <div class="body">
        <img src="teypo.png" alt="" draggable="false">
        <div class="lid" style="left:38.4%;top:40.6%"><svg viewBox="0 0 100 100"><defs><radialGradient id="lg" cx=".4" cy=".35"><stop offset="0" stop-color="#5d6268"/><stop offset="1" stop-color="#34383d"/></radialGradient></defs><circle cx="50" cy="50" r="50" fill="url(#lg)"/><path d="M28 54 Q50 70 72 54" fill="none" stroke="#120a06" stroke-width="7" stroke-linecap="round"/></svg></div>
        <div class="lid" style="left:70.5%;top:39.3%"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="url(#lg)"/><path d="M28 54 Q50 70 72 54" fill="none" stroke="#120a06" stroke-width="7" stroke-linecap="round"/></svg></div>
        <div class="slot" id="slot"><div class="mini" id="mini"><i></i><i></i></div></div>
      </div>
    </div>

    <div class="hint" id="hint">bir kaset kap,<br>bana tak!
      <svg width="70" height="46" viewBox="0 0 70 46" aria-hidden="true"><path d="M60 4 C40 6 22 18 12 38" fill="none" stroke="#2a1810" stroke-width="6" stroke-linecap="round"/><path d="M60 4 C40 6 22 18 12 38" fill="none" stroke="#f6ead0" stroke-width="3" stroke-linecap="round"/><path d="M4 28 L12 40 L24 32" fill="none" stroke="#2a1810" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 28 L12 40 L24 32" fill="none" stroke="#f6ead0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div id="sceneTapes"></div>
    <div class="vignette"></div>
  </div>
</div>

<header class="sign"><span class="rope"></span><div class="plank"><h1>Erdem</h1><p>Bilgisayar Müh. · Web &amp; Oyun</p></div></header>
<button class="sound" id="sound" type="button" aria-pressed="true">♪ AÇIK</button>
<div class="tray" id="tray" aria-label="Kasetler"></div>

<section class="term" aria-live="polite">
  <div class="bar"><span>teypo@erdem:~$</span><span id="track">BEKLEMEDE</span></div>
  <p id="say"></p>
  <small id="sub">[sürükle] kaseti robota tak · [tıkla] hızlı oynat</small>
</section>

<div class="viewer" id="viewer" hidden>
  <div class="tv" role="dialog" aria-modal="true" aria-labelledby="vTitle">
    <article class="screen">
      <div class="row"><span id="vSide"></span><span class="chip" id="vStatus"></span></div>
      <h2 id="vTitle"></h2>
      <div class="kind" id="vKind"></div>
      <p class="desc" id="vDesc"></p>
      <ul class="stack" id="vStack"></ul>
      <div class="actions" id="vActions"></div>
    </article>
    <div class="knobs" aria-hidden="true"><span class="knob"></span><span class="knob k2"></span><span class="grill"></span></div>
  </div>
</div>

<script>
/* ==== İçerik: projeleri buradan düzenle (x,y = odadaki yer, 1024×572 ölçeğinde) ==== */
const PROJECTS = [
  { id:"hakkimda", title:"Hakkımda", kind:"Tanışma", shell:"#efe2c4", lab:"#d9774a", status:"Aktif", x:830, y:203, sc:.85, r:"3deg",
    desc:"Mersin Üniversitesi Bilgisayar Mühendisliği 2. sınıf öğrencisiyim. Güçlü bir web geliştirme altyapım var; fikirleri ürüne dönüştürüp yayına almayı seviyorum. Web, mobil oyun ve donanım projeleri arasında geziyorum.",

const $ = s => document.querySelector(s);
const stage=$("#stage"), robot=$("#robot"), sceneTapes=$("#sceneTapes"), tray=$("#tray"), sayEl=$("#say"), viewer=$("#viewer");
let k=1, mx=0, my=0, current=null, busy=false, typeTimer=null, audio=null, muted=false, noteTimer=null;
const narrow = matchMedia("(max-width:700px)");

/* ---- sahne ölçekleme + parallax ---- */
function fit(){
  const vw=innerWidth, vh=innerHeight;
  k=Math.max(vw/1024, vh/572)*1.04;
  const shiftY = vw < vh ? -vh*0.05 : 0;
  stage.style.transform=`translate(calc(-50% + ${-mx*10}px), calc(-50% + ${-my*7 + shiftY}px)) scale(${k})`;
}
addEventListener("resize", fit);
addEventListener("pointermove", e => { if(e.pointerType!=="mouse") return; mx=e.clientX/innerWidth-.5; my=e.clientY/innerHeight-.5; fit(); });

/* ---- kasetler ---- */
const tapeEls = {};
PROJECTS.forEach((p,i) => {
  const b=document.createElement("button");
  b.className="tape"; b.type="button"; b.dataset.id=p.id;
  b.style.cssText=`left:${p.x}px;top:${p.y}px;--sc:${p.sc};--r:${p.r};--shell:${p.shell};--lab:${p.lab}`;
  b.setAttribute("aria-label", p.title+" kasetini oynat");
  b.innerHTML=`<span class="cas"><span class="lab"><em>A</em><b>${p.title}</b></span><span class="win"><i></i><i></i></span><span class="scr a"></span><span class="scr b"></span></span><span class="easel"><span class="contact"></span></span>`;
  tapeEls[p.id]=b; bindDrag(b,p);
});
function placeTapes(){ const host = narrow.matches ? tray : sceneTapes; PROJECTS.forEach(p=>host.appendChild(tapeEls[p.id])); }
narrow.addEventListener("change", placeTapes); placeTapes();

/* ---- ses ---- */
function ensureAudio(){ try{ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==="suspended") audio.resume(); }catch(e){} }
function tone(f,d=.06,type="square",vol=.03,slide){
  if(!audio||muted) return;
  const o=audio.createOscillator(), g=audio.createGain(), t=audio.currentTime;
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t+d);
}
const sfx={
  pick:()=>tone(700,.07,"triangle",.05,1100),
  drop:()=>tone(500,.1,"triangle",.05,250),
  clunk:()=>{tone(150,.12,"triangle",.14,80);setTimeout(()=>tone(95,.16,"triangle",.12),90);setTimeout(()=>{tone(523,.09,"square",.025);setTimeout(()=>tone(784,.12,"square",.025),90)},320)},
  eject:()=>{tone(220,.08,"triangle",.12);setTimeout(()=>tone(440,.1,"triangle",.06,880),70)},
  blip:()=>tone(560+Math.random()*140,.025,"square",.018)
};
$("#sound").onclick=e=>{ muted=!muted; e.currentTarget.textContent = muted?"♪ KAPALI":"♪ AÇIK"; e.currentTarget.setAttribute("aria-pressed",String(!muted)); };

/* ---- terminal ---- */
function say(text){
  clearInterval(typeTimer); sayEl.textContent=""; let i=0;
  typeTimer=setInterval(()=>{ sayEl.textContent=text.slice(0,++i); if(i%3===0) sfx.blip(); if(i>=text.length) clearInterval(typeTimer); },28);
}

/* ---- sürükle-bırak ---- */
function makeGhost(el){
  const r=el.getBoundingClientRect(), inScene=!!el.closest(".stage"), s=inScene?k*parseFloat(getComputedStyle(el).getPropertyValue("--sc")||1):1;
  const g=el.cloneNode(true); g.className="tape ghost"; g.style.cssText=`--shell:${el.style.getPropertyValue("--shell")};--lab:${el.style.getPropertyValue("--lab")};font-size:${inScene?10:13}px`;
  document.body.appendChild(g);
  const cas=el.querySelector(".cas").getBoundingClientRect();
  g._s=s; g._x=cas.left; g._y=cas.top; place(g,cas.left,cas.top,s,-6);
  return g;
}
function place(g,x,y,s,rot=0){ g._x=x; g._y=y; g.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${rot}deg)`; }
function slotPoint(g){ const r=$("#slot").getBoundingClientRect(); const w=g.offsetWidth*g._s; return {x:r.left+r.width/2-w*.45/2, y:r.top-6}; }

function bindDrag(el,p){
  let sx=0,sy=0,dragging=false,ghost=null,ox=0,oy=0;
  el.addEventListener("pointerdown",e=>{
    if(e.button!==0||busy) return; ensureAudio();
    sx=e.clientX; sy=e.clientY; dragging=false; el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove",e=>{
    if(!el.hasPointerCapture(e.pointerId)) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(!dragging){
      if(el.closest(".tray") && Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>8){ el.releasePointerCapture(e.pointerId); return; }
      if(Math.hypot(dx,dy)<7) return;
      dragging=true; ghost=makeGhost(el); ox=sx-ghost._x; oy=sy-ghost._y; el.classList.add("gone"); sfx.pick(); $("#hint").classList.add("off");
    }
    place(ghost,e.clientX-ox,e.clientY-oy,ghost._s*1.08,-6+dx*.02);
    robot.classList.toggle("hungry",overRobot(e.clientX,e.clientY));
  });
  const end=e=>{
    if(!el.hasPointerCapture(e.pointerId)) return;
    el.releasePointerCapture(e.pointerId); robot.classList.remove("hungry");
    if(!dragging){ insert(p); return; }
    const g=ghost; ghost=null;
    if(overRobot(e.clientX,e.clientY)) flyIn(g,p);
    else { sfx.drop(); const c=el.querySelector(".cas").getBoundingClientRect(); g.style.transition="transform .35s cubic-bezier(.3,1.3,.5,1)"; place(g,c.left,c.top,g._s);
      setTimeout(()=>{ g.remove(); if(current?.id!==p.id) el.classList.remove("gone"); },350); }
  };
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
  el.addEventListener("click",e=>{ if(e.detail===0){ ensureAudio(); insert(p); } });
}
function overRobot(x,y){ const r=robot.getBoundingClientRect(), pad=24; return x>r.left-pad&&x<r.right+pad&&y>r.top-pad&&y<r.bottom+pad; }

/* ---- tak / çıkar ---- */
function insert(p){
  if(busy) return;
  if(current?.id===p.id){ openViewer(p); return; }
  const el=tapeEls[p.id]; const g=makeGhost(el); el.classList.add("gone"); $("#hint").classList.add("off"); flyIn(g,p);
}
function flyIn(g,p){
  busy=true;
  const go=()=>{
    const t=slotPoint(g);
    g.style.transition="transform .42s cubic-bezier(.5,0,.6,1), opacity .2s .3s";
    place(g,t.x,t.y,g._s*.45,0); g.style.opacity="0";
    setTimeout(()=>{ g.remove(); load(p); },430);
  };
  if(current){ unload(true, go); } else go();
}
function load(p){
  current=p; busy=false;
  $("#mini").style.setProperty("--lab",p.lab);
  robot.classList.remove("gulp"); void robot.offsetWidth; robot.classList.add("gulp");
  setTimeout(()=>{ robot.classList.remove("gulp"); robot.classList.add("loaded"); },500);
  sfx.clunk(); say(p.line);
  $("#track").textContent="▶ "+p.title.toUpperCase(); $("#sub").textContent="[⏏] çıkar · [esc] kapat";
  clearInterval(noteTimer); noteTimer=setInterval(spawnNote,700);
  setTimeout(()=>{ if(current===p) openViewer(p); },700);
}
function openViewer(p){
  $("#vSide").textContent="SIDE A · "+String(PROJECTS.indexOf(p)+1).padStart(2,"0")+"/"+String(PROJECTS.length).padStart(2,"0");
  const st=$("#vStatus"); st.textContent=p.status; st.classList.toggle("live",p.status==="Yayında");
  $("#vTitle").textContent=p.title; $("#vKind").textContent="> "+p.kind; $("#vDesc").textContent=p.desc;
  $("#vStack").innerHTML=p.stack.map(s=>`<li>${s}</li>`).join("");
  $("#vActions").innerHTML=p.links.map(l=>`<a href="${l.u}" target="_blank" rel="noopener">${l.t} ↗</a>`).join("")+`<button class="eject" id="ejectBtn" type="button">⏏ Çıkar</button>`;
  $("#ejectBtn").onclick=()=>unload(false);
  viewer.hidden=false; $("#ejectBtn").focus({preventScroll:true});
}
function unload(silent, then){
  if(!current){ then&&then(); return; }
  const p=current, el=tapeEls[p.id]; current=null;
  viewer.hidden=true; robot.classList.remove("loaded"); clearInterval(noteTimer); sfx.eject();
  /* kaset yuvadan fırlayıp yerine döner */
  el.classList.remove("gone"); const c=el.querySelector(".cas").getBoundingClientRect(); el.classList.add("gone");
  const g=makeGhost(el); const s=g._s; const t=slotPoint(g);
  place(g,t.x,t.y,s*.45,0); g.style.opacity="0";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    g.style.transition="transform .5s cubic-bezier(.3,1.2,.5,1), opacity .15s"; g.style.opacity="1"; place(g,c.left,c.top,s,0);
  }));
  setTimeout(()=>{ g.remove(); el.classList.remove("gone","pop"); void el.offsetWidth; el.classList.add("pop"); },500);
  if(!silent){ say("Kaset çıktı. Sıradaki hangisi?"); $("#track").textContent="BEKLEMEDE"; $("#sub").textContent="[sürükle] kaseti robota tak · [tıkla] hızlı oynat"; }
  if(then) setTimeout(then,120);
}
viewer.addEventListener("click",e=>{ if(e.target===viewer) unload(false); });
addEventListener("keydown",e=>{ if(e.key==="Escape"&&!viewer.hidden) unload(false); });
robot.addEventListener("click",()=>{ if(current) openViewer(current); else say("Karnım boş! Bir kaseti sürükleyip bana tak."); });

/* ---- notalar ---- */
function spawnNote(){
  if(document.hidden) return;
  const n=document.createElement("span"); n.className="note"; n.textContent=Math.random()<.5?"♪":"♫";
  const left=Math.random()<.5; n.style.left=(left?420:585)+"px"; n.style.top="300px";
  n.style.setProperty("--dx",(left?-1:1)*(15+Math.random()*25)+"px"); n.style.setProperty("--rot",(left?-1:1)*20+"deg");
  stage.appendChild(n); setTimeout(()=>n.remove(),2300);
}

/* ---- göz kırpma ---- */
(function blinkLoop(){ setTimeout(()=>{ robot.classList.add("blink"); setTimeout(()=>{ robot.classList.remove("blink"); if(Math.random()<.25) setTimeout(()=>{robot.classList.add("blink");setTimeout(()=>robot.classList.remove("blink"),110)},180); blinkLoop(); },130); }, 2500+Math.random()*3000); })();

/* ---- ışık huzmesindeki toz ---- */
(function dust(){
  const c=$("#dust"), x=c.getContext("2d"); x.scale(2,2);
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const inBeam=(px,py)=>{ const t=(py-140)/(572-140); if(t<0) return false; const l=92+(250-92)*t, r=178+(640-178)*t; return px>l&&px<r; };
  const P=Array.from({length:70},()=>({x:100+Math.random()*500,y:140+Math.random()*430,r:.6+Math.random()*1.6,vx:(Math.random()-.3)*.12,vy:(Math.random()-.5)*.1,ph:Math.random()*6}));
  (function tick(t){
    x.clearRect(0,0,1024,572);
    for(const p of P){
      p.x+=p.vx+Math.sin(t/2000+p.ph)*.05; p.y+=p.vy+Math.cos(t/2500+p.ph)*.04;
      if(p.y>572||p.y<130||p.x>660||p.x<80){ p.y=150+Math.random()*400; p.x=120+((p.y-140)/432)*300+Math.random()*120; }
      if(!inBeam(p.x,p.y)) continue;
      x.globalAlpha=.35+.45*Math.abs(Math.sin(t/900+p.ph)); x.fillStyle="#fff2c8";
      x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill();
    }
    requestAnimationFrame(tick);
  })(0);
})();

fit();
say("Merhaba! Ben Teypo. Erdem'in projeleri odadaki kasetlerde. Birini kapıp bana tak!");
</script>

<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Erdem — Portfolyo</title>
  <meta name="description" content="Erdem'in projeleri: web, mobil oyun ve IoT. BMO'nun ağaç evinde bir kaset tak, projeyi keşfet.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Erdem — Portfolyo">
  <meta property="og:description" content="BMO'nun ağaç evinde bir kaset tak, projeyi keşfet.">
  <meta property="og:image" content="/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#a8703f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- font CSS'i ilk çizimi engellemesin: preload → yüklenince stylesheet'e döner -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Nunito:wght@500;700;800&family=VT323&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Nunito:wght@500;700;800&family=VT323&display=swap"></noscript>
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Person","name":"Erdem","jobTitle":"Bilgisayar Mühendisliği Öğrencisi","affiliation":{"@type":"CollegeOrUniversity","name":"Mersin Üniversitesi"},"knowsAbout":["Web","Unity","Mobil Oyun","IoT"]}
  </script>
</head>
<body>
  <div class="loader" id="loader" aria-hidden="true"><div class="loader-screen"><span>LOADING</span><i><b id="loaderBar"></b></i></div></div>

  <!-- Görünür tabela ya da ayar tuşu yok: oda arayüzün kendisi (ses, gün saati, dil, liste BMO'nun tuşlarında).
       Başlık ekran okuyucu ve arama motorları için; şerit yalnız çentik payı kadar (açık ekranın üst sınırı). -->
  <header class="topbar" id="topbar">
    <h1 class="sr-only">Erdem · <span data-i18n="tagline"></span></h1>
  </header>

  <main class="room" id="room">
    <div class="stage" id="stage">
      <img id="bgDay" class="bg" alt="" fetchpriority="high" decoding="async" sizes="(max-width: 700px) 100vw, (orientation: portrait) 100vw, (min-aspect-ratio: 16/9) 104vw, 185vh" srcset="/bg/day-1920.webp 1920w, /bg/day-2752.webp 2752w" src="/bg/day-1920.webp">
      <img id="bgNight" class="bg" alt="" decoding="async" fetchpriority="low">
      <canvas class="world" id="world" aria-hidden="true"></canvas>
      <canvas class="particles" id="particles" aria-hidden="true"></canvas>
      <div class="tint"></div>
      <div class="vignette"></div>
      <!-- DOM sırası = Tab sırası: kasetler → BMO -->
      <div class="tape-btns" id="tapeBtns"></div>
      <button type="button" class="bmo-hit" id="bmoHit" aria-label="BMO"></button>
      <!-- BMO'nun 3D tuşlarının üstündeki tıklama alanları (konumları world.keyRect'ten) -->
      <div class="bmo-keys" id="bmoKeys" hidden>
        <button type="button" class="bmo-key" data-key="red" data-i18n-aria="sound_aria" aria-pressed="false"></button>
        <button type="button" class="bmo-key" data-key="triangle" data-i18n-aria="time_aria"></button>
        <button type="button" class="bmo-key" data-key="green" data-i18n-aria="lang_aria"></button>
        <button type="button" class="bmo-key" data-key="dpad" data-i18n-aria="list_aria"></button>
      </div>
    </div>
  </main>

  <div class="speech" id="speech" aria-hidden="true" hidden><p><span class="who">&gt; BMO:</span> <span id="speechText"></span></p><small id="speechHint" data-i18n="hint"></small><small id="speechTip" class="tip" hidden></small></div>
  <p class="sr-only" id="live" aria-live="polite"></p>

  <div class="tray" id="tray" data-i18n-aria="tray_aria"></div>

  <div class="screen-backdrop" id="screenBackdrop" hidden></div>
  <section class="screen-ui" id="screenUi" role="dialog" aria-modal="true" aria-labelledby="sTitle" hidden></section>

  <section class="listview" id="listview" aria-labelledby="lvTitle" hidden></section>

  <footer class="fanart" id="fanart" data-i18n="footer_note"></footer>

  <noscript>
    <div class="noscript">
      <h1>Erdem — Portfolyo</h1>
      <p>Mersin Üniversitesi Bilgisayar Mühendisliği öğrencisi. Projeler: 81 Okey (Unity mobil oyun), TBH Trade (Steam pazar aracı), Sanal Davetiyecim (dijital davetiye girişimi), Radar Mayın (mobil bulmaca), ESP32 İstasyon (IoT), JARVIS (sesli asistan).</p>
    </div>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
